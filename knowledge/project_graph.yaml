# Machine-readable project graph.
# Keep this compact and update it when project components, branches, or
# evidence relationships change.

project:
  name: starter host project
  status: starter
  summary: Clean agent-wiki scaffold state. Replace with the host project summary after evidence is provided.

nodes:
  - id: project_main
    type: project
    label: Main Project
    status: starter
    wiki: wiki/topics/project_overview.md

edges:
  - from: project_main
    to: active_plan
    type: guided_by

references:
  - id: active_plan
    type: plan
    path: wiki/plans/active_plan.md
  - id: project_overview
    type: topic
    path: wiki/topics/project_overview.md
