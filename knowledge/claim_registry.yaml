# Durable project claims.
# Claims should be evidence-linked and status-aware.

claims:
  - id: claim_scaffold_separates_memory_surfaces
    status: accepted
    summary: The scaffold separates host-project work from curator-owned compact wiki truth, structured registries, raw sources, and generated results.
    evidence:
      - README.md
      - AGENTS.md
    last_checked: 2026-06-06
    superseded_by: []

  - id: claim_active_focus_agent_wiki_performance
    status: accepted
    summary: The active project focus is improving agent-wiki performance and reliability by making handoffs more auditable, curator activation safer, and semantic truth-promotion harder to misuse.
    evidence:
      - "user request: 2026-06-06"
      - sources/plans/2026-06-06_git_backed_handoffs_curator_wakeup_semantic_gates.md
    last_checked: 2026-06-06
    superseded_by: []

  - id: claim_plan_git_provenance_jsonl_queue
    status: verified
    summary: scan_changes.py implements Git-aware handoff records while retaining knowledge/change_inbox.jsonl as the portable queue and avoiding automatic Git mutations.
    evidence:
      - scripts/wiki/scan_changes.py
      - templates/handoff.json
      - knowledge/change_inbox.jsonl
      - sources/plans/2026-06-06_git_backed_handoffs_curator_wakeup_semantic_gates.md
    verification:
      - python -m py_compile scripts/wiki/*.py
      - python scripts/wiki/scan_changes.py --dry-run
    last_checked: 2026-06-06
    superseded_by: []

  - id: claim_wakeup_queue_helpers_implemented
    status: verified
    summary: The handoff workflow now emits safe wake-up events and provides watcher and queue-helper scripts for curator notification and append-only handoff acknowledgement.
    evidence:
      - scripts/wiki/scan_changes.py
      - scripts/wiki/watch_handoffs.py
      - scripts/wiki/handoff_queue.py
      - knowledge/events.jsonl
      - knowledge/change_inbox.jsonl
    verification:
      - python scripts/wiki/watch_handoffs.py --once --no-bell
      - python scripts/wiki/handoff_queue.py list
      - python -m py_compile scripts/wiki/*.py
    last_checked: 2026-06-06
    superseded_by: []

  - id: claim_semantic_lint_warnings_implemented
    status: verified
    summary: lint.py now validates handoff and event JSONL and warns about unsupported truth promotion, missing truth-impact fields, and completed/verified items without evidence.
    evidence:
      - scripts/wiki/lint.py
      - knowledge/change_inbox.jsonl
      - knowledge/events.jsonl
    verification:
      - python scripts/wiki/lint.py
    last_checked: 2026-06-06
    superseded_by: []

  - id: claim_opencode_build_agent_context_memory_rules
    status: verified
    summary: The project-root OpenCode template configures the built-in build agent as a host implementer with /contextualize context refresh and agent-wiki host-agent memory rules by default.
    evidence:
      - templates/project-root/opencode.json
      - .opencode/instructions.md
      - templates/project-root/README.md
      - docs/opencode-workflow.md
      - README.md
      - knowledge/change_inbox.jsonl
    verification:
      - python scripts/wiki/lint.py
      - python scripts/wiki/check_host_agent_rules.py --project-root . --config templates/project-root/opencode.json --check
    last_checked: 2026-06-06
    superseded_by: []
