name: agent-wiki lint

on:
  pull_request:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile helper scripts
        run: python -m py_compile scripts/wiki/*.py
      - name: Lint agent wiki
        run: python scripts/wiki/lint.py

